[project]
name = "grounded-rag"
version = "0.1.0"
description = "Permission-aware grounded RAG + tool-using agent on the Cohere API (Command, Embed, Rerank), with an offline backend, evals and structured logs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Akshay Palimkar" }]
dependencies = [
  "cohere>=5.15",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "numpy>=1.26",
  "rank-bm25>=0.2.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
grounded-rag = "grounded_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grounded_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
